version: '3.8'
services:
  orders.api:
    build: .
    ports:
      - "5000:80"
    volumes:
      - ./data:/app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

# Note: SQLite stores data in a file in the app folder. We mount ./data to /app so the orders.db file is persisted.
